<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/x-icon" href="../img/Tokped-ICO.webp" />
    <title>GOAT Tokopedia</title>

    <!-- Inlined to avoid a render-blocking request on mobile (FCP/LCP) -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var theme = saved || (prefersDark ? "dark" : "light");
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
        } catch (e) {}
      })();
    </script>
    <link rel="stylesheet" href="css/style.css" />

    <!-- This page's dedicated CSV source (Tokopedia sheet) -->
    <script>
      window.STORE_CONFIG = {
        csvUrl:
          "https://docs.google.com/spreadsheets/d/e/2PACX-1vRMSVSL-88iVwW3uH0JQdTYIVWUkwMOs-_xfVh1c2RGY5qhAFDlP_SJlY2nw8P3c5dDimDYuMku6DGR/pub?gid=979915917&single=true&output=csv",
        title: "GOAT Tokopedia",
      };
    </script>
  </head>
  <body class="storefront">
    <header class="app-header">
      <!-- Back to main store -->
      <a href="../index.html" class="back-btn" aria-label="Back to homepage">
        <svg
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2.4"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
        <span>Back</span>
      </a>

      <h1>GOAT Tokopedia</h1>

      <!-- Theme toggle -->
      <button
        id="themeToggle"
        type="button"
        aria-label="Toggle light/dark theme"
        class="theme-toggle"
      >
        <!-- Sun icon -->
        <svg
          id="iconSun"
          class="icon hidden"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <circle cx="12" cy="12" r="4"></circle>
          <path
            d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"
          />
        </svg>
        <!-- Moon icon -->
        <svg
          id="iconMoon"
          class="icon hidden"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </header>

    <main class="app-main">
      <!-- Search -->
      <input
        id="searchInput"
        type="search"
        placeholder="Search by number or name..."
        class="search-input"
        autocomplete="off"
        spellcheck="false"
      />

      <!-- Category Filter Tabs (auto-generated from sheet data) -->
      <div id="categoryTabs" class="cat-tabs"></div>

      <div class="table-wrap">
        <!-- Table header, styled like the spreadsheet -->
        <div class="table-header" aria-hidden="true">
          <div>No.</div>
          <div>Category</div>
          <div>Name</div>
          <div class="tc">Link</div>
        </div>

        <!-- Rows get injected here -->
        <div id="linksGrid" class="links-grid">
          <div class="state-msg" id="loadingState">
            Loading curated finds... ⏳
          </div>
        </div>
      </div>
    </main>

    <script defer src="js/main.js"></script>
  </body>
</html>
