<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f5e6d3" />
    <title>Snake — Time-o-Learn</title>

    <style>
      /* ============================================================
       Tokens & Base Variables (claymorphism palette)
       ============================================================ */
      :root {
        --surface-000: #f5e6d3;
        --surface-010: #fdebd6;
        --surface: #fdf1e0;
        --surface-deep: #efd9bd;

        --clay-shadow-dark: #d3b795;
        --clay-shadow-light: #fff7ea;

        --brand-050: #63b855;
        --brand-strong: #3f8a34;
        --brand: #7dcf6c;

        --status-ok: #f0653f;
        --status-fail: #d2544c;

        --text: #4a3a2e;
        --text-muted: #7d6a58;

        --game-board: #f2ddc0;
        --game-cell-a: #f6e4c8;
        --game-cell-b: #edd5b4;
        --snake-shadow: rgba(139, 108, 71, 0.4);
        --food-deep: #cf4f2e;
        --food-highlight: rgba(255, 255, 255, 0.7);

        --radius-md: 18px;
        --radius-lg: 28px;
        --radius-full: 9999px;

        --shadow-clay-sm:
          4px 4px 0 var(--clay-shadow-dark),
          -3px -3px 0 var(--clay-shadow-light);
        --shadow-clay-lg:
          10px 10px 0 var(--clay-shadow-dark),
          -6px -6px 0 var(--clay-shadow-light);
        --shadow-clay-inset:
          inset 4px 4px 8px rgba(190, 150, 110, 0.45),
          inset -4px -4px 8px rgba(255, 255, 255, 0.65);

        --game-cols: 20;
        --game-cell: 18px;
      }

      /* ============================================================
       Game Shell Styles (game-shell.css fallback)
       ============================================================ */
      * {
        box-sizing: border-box;
      }
      body.game-page {
        margin: 0;
        padding: 0;
        background:
          radial-gradient(circle at 15% 12%, #fdf6e8 0%, transparent 55%),
          radial-gradient(circle at 85% 88%, #f9e6cc 0%, transparent 55%),
          var(--surface-000);
        color: var(--text);
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
      }
      .skip-link {
        position: absolute;
        top: -60px;
        left: 0;
        background: var(--brand-strong);
        color: #ffffff;
        padding: 10px 16px;
        border-radius: var(--radius-full);
        font-weight: 700;
        text-decoration: none;
        z-index: 100;
      }
      .skip-link:focus {
        top: 12px;
        left: 12px;
      }
      .game-header {
        width: 100%;
        max-width: 500px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1.25rem 1rem 0.75rem;
      }
      .game-title {
        margin: 0;
        font-size: 1.35rem;
        font-weight: 800;
        color: var(--text);
      }
      .icon-btn {
        background: var(--surface-010);
        color: var(--text);
        border: none;
        border-radius: var(--radius-md);
        padding: 0.6rem 0.9rem;
        cursor: pointer;
        text-decoration: none;
        font-size: 1.1rem;
        font-weight: 700;
        box-shadow: var(--shadow-clay-sm);
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }
      .icon-btn:hover {
        transform: translateY(-1px);
      }
      .icon-btn:active {
        transform: translateY(2px);
        box-shadow: var(--shadow-clay-inset);
      }
      .icon-btn:focus-visible {
        outline: 3px solid
          color-mix(in srgb, var(--brand-strong) 55%, transparent);
        outline-offset: 2px;
      }
      .game-stage-wrap {
        width: 100%;
        display: flex;
        justify-content: center;
        padding: 0.5rem 1rem 1.5rem;
      }
      .game-hud {
        font-size: 1.5rem;
        font-weight: 800;
        text-align: center;
        margin: 0 auto 0.9rem;
        width: fit-content;
        min-width: 132px;
        padding: 0.35rem 1.6rem;
        background: var(--surface);
        border-radius: var(--radius-full);
        box-shadow: var(--shadow-clay-sm);
        color: var(--text);
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      .dpad {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        width: 180px;
        margin: 1.25rem auto 0;
      }
      .dpad-btn {
        background: var(--surface-010);
        color: var(--text);
        border: none;
        border-radius: var(--radius-full);
        padding: 12px;
        font-size: 1.2rem;
        font-weight: 700;
        line-height: 1;
        aspect-ratio: 1;
        cursor: pointer;
        touch-action: manipulation;
        box-shadow: var(--shadow-clay-sm);
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }
      .dpad-btn:active {
        transform: translateY(2px);
        box-shadow: var(--shadow-clay-inset);
      }
      .dpad-btn:focus-visible {
        outline: 3px solid
          color-mix(in srgb, var(--brand-strong) 55%, transparent);
        outline-offset: 2px;
      }

      /* ============================================================
       Snake Game Specific Styles (snake.css)
       ============================================================ */
      .game-stage {
        position: relative;
        max-width: 100%;
      }

      #snake-canvas {
        aspect-ratio: 1;
        width: min(100%, calc(var(--game-cols) * var(--game-cell)));
        max-width: 100%;
        margin-inline: auto;
        touch-action: none;
        cursor: pointer;
        display: block;
        background: var(--game-board);
        border-radius: var(--radius-lg);
        border: 4px solid var(--surface-010);
        box-shadow:
          var(--shadow-clay-sm),
          inset 5px 5px 10px rgba(190, 150, 110, 0.4),
          inset -5px -5px 10px rgba(255, 255, 255, 0.55);
      }

      #hud-score {
        font-variant-numeric: tabular-nums;
      }

      .game-overlay {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: color-mix(in srgb, var(--surface-deep) 62%, transparent);
        backdrop-filter: blur(2px);
        border-radius: var(--radius-lg);
        z-index: 10;
      }

      .game-overlay.is-open {
        display: grid;
      }

      .overlay-card {
        text-align: center;
        padding: 1.75rem 2.25rem;
        background: var(--surface);
        border-radius: var(--radius-lg);
        border: 3px solid var(--surface-010);
        box-shadow: var(--shadow-clay-lg);
        max-width: 90%;
      }

      .overlay-title {
        font-size: 1.5rem;
        font-weight: 800;
        color: var(--text);
        margin: 0 0 0.5rem;
      }

      .overlay-over {
        color: var(--status-fail);
      }

      .overlay-paused {
        color: var(--brand-strong);
      }

      .overlay-score {
        display: block;
        margin: 0 0 1.1rem;
        font-size: 1.1rem;
        font-weight: 600;
        color: var(--text-muted);
      }

      .btn-primary {
        display: inline-block;
        min-width: 140px;
        padding: 0.85rem 1.5rem;
        border: none;
        border-radius: var(--radius-full);
        background: var(--brand);
        color: #24351f;
        font-size: 1rem;
        font-weight: 800;
        cursor: pointer;
        touch-action: manipulation;
        box-shadow: var(--shadow-clay-sm);
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }

      .btn-primary:active {
        transform: translateY(2px);
        box-shadow: var(--shadow-clay-inset);
      }

      .btn-primary:focus-visible {
        outline: 3px solid
          color-mix(in srgb, var(--brand-strong) 55%, transparent);
        outline-offset: 2px;
      }

      @media (min-width: 600px) {
        .game-stage {
          max-width: 560px;
        }
        #snake-canvas {
          width: min(100%, 480px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .game-overlay,
        .overlay-card,
        .icon-btn,
        .dpad-btn,
        .btn-primary {
          transition: none;
        }
      }
    </style>

    <script>
      // Inline Safe i18n Fallback (replaces external config.js / i18n.js)
      window.APP_CONFIG = window.APP_CONFIG || {};
      window.I18N = window.I18N || {
        t: function (key) {
          var translations = {
            "nav.skip": "Skip to game",
            "nav.back": "Back",
            "game.score": "Score",
            "game.best": "Best",
            "game.over": "Game over",
            "game.paused": "Paused",
            "game.restart": "Play again",
            "game.resume": "Resume",
            "game.play": "Game running",
            "game.pause": "Pause game",
          };
          return translations[key] || key;
        },
        load: function () {
          return Promise.resolve();
        },
        apply: function () {},
        onChange: function () {},
      };
    </script>
  </head>
  <body class="game-page">
    <a class="skip-link" href="#game-stage" data-i18n="nav.skip"
      >Skip to game</a
    >

    <header class="game-header">
      <a
        class="icon-btn"
        href="#"
        aria-label="Back to menu"
        data-i18n-attr="aria-label"
        data-i18n="nav.back"
        >←</a
      >
      <h1 class="game-title">Snake</h1>
      <button
        class="icon-btn"
        id="pause-btn"
        type="button"
        aria-pressed="false"
        aria-label="Pause"
      >
        ⏸
      </button>
    </header>

    <main class="game-stage-wrap" id="game-stage">
      <section class="game-stage" aria-label="Snake game">
        <div class="game-hud">
          <span class="hud-item" id="hud-score">0</span>
        </div>
        <canvas
          id="snake-canvas"
          class="game-canvas"
          width="300"
          height="300"
          aria-label="Snake game board"
          tabindex="0"
        ></canvas>

        <!-- Overlays -->
        <div
          class="game-overlay"
          id="overlay-over"
          role="dialog"
          aria-modal="true"
          aria-labelledby="overlay-over-title"
        >
          <div class="overlay-card">
            <p class="overlay-title overlay-over" id="overlay-over-title">
              Game over
            </p>
            <span class="overlay-score"></span>
            <button class="btn-primary" type="button" data-i18n="game.restart">
              Play again
            </button>
          </div>
        </div>
        <div
          class="game-overlay"
          id="overlay-pause"
          role="dialog"
          aria-modal="true"
          aria-labelledby="overlay-pause-title"
        >
          <div class="overlay-card">
            <p class="overlay-title overlay-paused" id="overlay-pause-title">
              Paused
            </p>
            <button class="btn-primary" type="button" data-i18n="game.resume">
              Resume
            </button>
          </div>
        </div>

        <p class="sr-only" aria-live="polite" id="sr-status"></p>
        <div class="dpad" aria-label="Direction controls">
          <span></span>
          <button class="dpad-btn" type="button" data-dir="up" aria-label="Up">
            ▲
          </button>
          <span></span>
          <button
            class="dpad-btn"
            type="button"
            data-dir="left"
            aria-label="Left"
          >
            ◀
          </button>
          <span></span>
          <button
            class="dpad-btn"
            type="button"
            data-dir="right"
            aria-label="Right"
          >
            ▶
          </button>
          <span></span>
          <button
            class="dpad-btn"
            type="button"
            data-dir="down"
            aria-label="Down"
          >
            ▼
          </button>
          <span></span>
        </div>
      </section>
    </main>

    <script>
      /**
       * Snake Game Engine (snake.js)
       */
      (function () {
        "use strict";

        var COLS = 20;
        var ROWS = 20;
        var TICK_MS = 120;
        var FRAME_MS = 33;

        var DX = [1, 0, -1, 0];
        var DY = [0, 1, 0, -1];
        var DIR_MAP = { up: 3, down: 1, left: 2, right: 0 };

        var POOL_SIZE = 400;
        var pool = new Array(POOL_SIZE);
        var poolHead = 0;

        function segPoolInit() {
          for (var i = 0; i < POOL_SIZE; i++) pool[i] = { x: 0, y: 0 };
          poolHead = 0;
        }

        function allocSeg(x, y) {
          var seg = poolHead < POOL_SIZE ? pool[poolHead++] : {};
          seg.x = x;
          seg.y = y;
          return seg;
        }

        function freeSeg(seg) {
          if (poolHead > 0) pool[--poolHead] = seg;
        }

        var canvas, ctx, scoreEl, srEl, pauseBtn;
        var snake;
        var food = { x: 10, y: 10 };
        var dir = 0;
        var nextDir = 0;
        var score = 0;
        var best = 0;
        var rafId;
        var running = false;
        var paused = false;
        var gameOver = false;
        var lastFrame = 0;
        var lastTick = 0;

        function $id(id) {
          return document.getElementById(id);
        }

        function t(key) {
          return window.I18N && I18N.t ? I18N.t(key) : key;
        }

        function isOccupied(x, y) {
          for (var i = 0; i < snake.length; i++) {
            if (snake[i].x === x && snake[i].y === y) return true;
          }
          return false;
        }

        function rndFood() {
          var tries = 64;
          while (tries--) {
            var x = 1 + ((Math.random() * (COLS - 2)) | 0);
            var y = 1 + ((Math.random() * (ROWS - 2)) | 0);
            if (!isOccupied(x, y)) {
              food.x = x;
              food.y = y;
              return true;
            }
          }
          var free = 0;
          for (var fy = 1; fy < ROWS - 1; fy++) {
            for (var fx = 1; fx < COLS - 1; fx++) {
              if (!isOccupied(fx, fy)) free++;
            }
          }
          if (!free) return false;
          var n = 0;
          var pick = (Math.random() * free) | 0;
          for (var py = 1; py < ROWS - 1; py++) {
            for (var px = 1; px < COLS - 1; px++) {
              if (!isOccupied(px, py)) {
                if (n === pick) {
                  food.x = px;
                  food.y = py;
                  return true;
                }
                n++;
              }
            }
          }
          return false;
        }

        function reset() {
          var i;
          if (snake) {
            for (i = 0; i < snake.length; i++) freeSeg(snake[i]);
          }
          snake = [allocSeg(10, 10), allocSeg(9, 10), allocSeg(8, 10)];
          dir = 0;
          nextDir = 0;
          score = 0;
          gameOver = false;
          paused = false;
          pauseBtn.setAttribute("aria-pressed", "false");
          pauseBtn.textContent = "⏸";
          rndFood();
          setHud();
        }

        function setHud() {
          scoreEl.textContent = String(score);
        }

        function setSr(text) {
          srEl.textContent = text;
        }

        function cssVar(name) {
          return (
            getComputedStyle(document.documentElement)
              .getPropertyValue(name)
              .trim() || "#ffffff"
          );
        }

        var palette = null;
        function loadPalette() {
          palette = {
            board: cssVar("--game-board"),
            cellA: cssVar("--game-cell-a"),
            cellB: cssVar("--game-cell-b"),
            snake: cssVar("--brand-050"),
            snakeHead: cssVar("--brand-strong"),
            snakeShadow: cssVar("--snake-shadow"),
            food: cssVar("--status-ok"),
            foodDeep: cssVar("--food-deep"),
            foodHighlight: cssVar("--food-highlight"),
          };
        }

        function rrect(x, y, w, h, r) {
          r = Math.min(r, w / 2, h / 2);
          ctx.beginPath();
          ctx.moveTo(x + r, y);
          ctx.arcTo(x + w, y, x + w, y + h, r);
          ctx.arcTo(x + w, y + h, x, y + h, r);
          ctx.arcTo(x, y + h, x, y, r);
          ctx.arcTo(x, y, x + w, y, r);
          ctx.closePath();
        }

        function draw() {
          var w = canvas.width;
          var h = canvas.height;
          var cw = w / COLS;
          var ch = h / ROWS;

          // Recessed clay board
          ctx.fillStyle = palette.board;
          ctx.fillRect(0, 0, w, h);

          // Clay checkerboard
          for (var y = 0; y < ROWS; y++) {
            for (var x = 0; x < COLS; x++) {
              ctx.fillStyle = (x + y) % 2 === 0 ? palette.cellA : palette.cellB;
              ctx.fillRect(x * cw, y * ch, cw, ch);
            }
          }

          // Glossy clay food ball
          var fx = (food.x + 0.5) * cw;
          var fy = (food.y + 0.5) * ch;
          var fr = Math.min(cw, ch) * 0.38;
          var grad = ctx.createRadialGradient(
            fx - fr * 0.35,
            fy - fr * 0.35,
            fr * 0.1,
            fx,
            fy,
            fr,
          );
          grad.addColorStop(0, palette.foodHighlight);
          grad.addColorStop(0.45, palette.food);
          grad.addColorStop(1, palette.foodDeep);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.arc(fx, fy, fr, 0, Math.PI * 2);
          ctx.fill();

          // Clay pellet snake
          for (var i = 0; i < snake.length; i++) {
            var seg = snake[i];
            var pad = Math.max(1, Math.min(cw, ch) * 0.16);
            var r = Math.min(cw, ch) * 0.3;
            var sx = seg.x * cw + pad;
            var sy = seg.y * ch + pad;
            var sw = cw - pad * 2;
            var sh = ch - pad * 2;

            ctx.fillStyle = palette.snakeShadow;
            rrect(sx + 2, sy + 2, sw, sh, r);
            ctx.fill();

            ctx.fillStyle = i === 0 ? palette.snakeHead : palette.snake;
            rrect(sx, sy, sw, sh, r);
            ctx.fill();
          }
        }

        function frame(now) {
          if (now - lastFrame < FRAME_MS) {
            rafId = requestAnimationFrame(frame);
            return;
          }
          lastFrame = now;

          if (running && !paused && !gameOver) {
            if (now - lastTick >= TICK_MS) {
              lastTick = now;
              step();
            }
            draw();
          }
          rafId = requestAnimationFrame(frame);
        }

        function step() {
          dir = nextDir;
          var head = allocSeg(snake[0].x + DX[dir], snake[0].y + DY[dir]);

          if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
            freeSeg(head);
            endGame();
            return;
          }

          for (var i = 0; i < snake.length - 1; i++) {
            if (snake[i].x === head.x && snake[i].y === head.y) {
              freeSeg(head);
              endGame();
              return;
            }
          }

          snake.unshift(head);

          if (head.x === food.x && head.y === food.y) {
            score++;
            setHud();
            setSr(t("game.score") + " " + score);
            if (!rndFood()) {
              endGame();
              return;
            }
          } else {
            freeSeg(snake.pop());
          }
        }

        function endGame() {
          gameOver = true;
          running = false;
          if (score > best) {
            best = score;
            try {
              localStorage.setItem("tol_snake_best", String(best));
            } catch (e) {}
          }
          openOverlay("over", score, best);
          setSr(t("game.over") + " " + t("game.score") + " " + score);
        }

        function openOverlay(kind, score, best) {
          var el = $id("overlay-" + kind);
          if (!el) return;
          el.querySelector(".overlay-title").textContent =
            kind === "over" ? t("game.over") : t("game.paused");
          var s = el.querySelector(".overlay-score");
          if (s)
            s.textContent =
              t("game.score") +
              ": " +
              score +
              "  ·  " +
              t("game.best") +
              ": " +
              best;
          el.classList.add("is-open");
          var btn = el.querySelector(".btn-primary");
          if (btn) btn.focus();
        }

        function closeOverlay(kind) {
          var el = $id("overlay-" + kind);
          if (el) el.classList.remove("is-open");
        }

        function queueDir(i) {
          if (DX[i] === -DX[dir] && DY[i] === -DY[dir]) return;
          nextDir = i;
          if (paused && !gameOver) togglePause();
        }

        function togglePause() {
          if (gameOver || !running) return;
          paused = !paused;
          pauseBtn.setAttribute("aria-pressed", String(paused));
          pauseBtn.textContent = paused ? "▶" : "⏸";
          if (paused) openOverlay("pause", score, best);
          else closeOverlay("pause");
        }

        function start() {
          reset();
          running = true;
          closeOverlay("over");
          closeOverlay("pause");
          setSr(t("game.play"));
        }

        function bindInput() {
          document.querySelectorAll(".dpad-btn").forEach(function (btn) {
            btn.addEventListener("click", function () {
              queueDir(DIR_MAP[btn.getAttribute("data-dir")]);
            });
          });

          var sx = 0,
            sy = 0;
          canvas.addEventListener(
            "touchstart",
            function (e) {
              var t = e.changedTouches[0];
              sx = t.clientX;
              sy = t.clientY;
            },
            { passive: true },
          );

          canvas.addEventListener(
            "touchend",
            function (e) {
              var t = e.changedTouches[0];
              var dx = t.clientX - sx;
              var dy = t.clientY - sy;
              if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
              if (Math.abs(dx) > Math.abs(dy)) queueDir(dx > 0 ? 0 : 2);
              else queueDir(dy > 0 ? 1 : 3);
            },
            { passive: true },
          );

          document.addEventListener("keydown", function (e) {
            if (e.key === "ArrowUp") {
              e.preventDefault();
              queueDir(3);
            } else if (e.key === "ArrowDown") {
              e.preventDefault();
              queueDir(1);
            } else if (e.key === "ArrowLeft") {
              e.preventDefault();
              queueDir(2);
            } else if (e.key === "ArrowRight") {
              e.preventDefault();
              queueDir(0);
            } else if (e.key === " " || e.key === "Spacebar") {
              e.preventDefault();
              togglePause();
            }
          });

          pauseBtn.addEventListener("click", togglePause);

          document.querySelectorAll(".btn-primary").forEach(function (btn) {
            btn.addEventListener("click", start);
          });
        }

        function boot() {
          canvas = $id("snake-canvas");
          ctx = canvas.getContext("2d");
          scoreEl = $id("hud-score");
          srEl = $id("sr-status");
          pauseBtn = $id("pause-btn");

          canvas.width = COLS * 15;
          canvas.height = ROWS * 15;

          segPoolInit();
          loadPalette();
          bindInput();

          try {
            best = parseInt(localStorage.getItem("tol_snake_best"), 10) || 0;
          } catch (e) {
            best = 0;
          }

          reset();
          draw();
          running = true;
          lastFrame = lastTick = performance.now();
          rafId = requestAnimationFrame(frame);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", boot);
        } else {
          boot();
        }
      })();
    </script>
  </body>
</html>
