<!-- @format -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape"
    />
    <title>Matching Game 🧩</title>
    <style>
      :root {
        /* Claymorphism design tokens */
        --clay-bg: #f6d7c3;
        --clay-bg-2: #f0bda6;
        --clay-surface: #faf0e6;
        --clay-surface-soft: #f5e7d7;
        --clay-primary: #f28c5f;
        --clay-primary-hover: #e8784a;
        --clay-accent: #67b99a;
        --clay-danger: #d65a5a;
        --clay-text: #4a3f35;
        --clay-dark: #e5c7ad;
        --clay-shadow: #d9b99d;
        --clay-highlight: #fff8ef;
        --clay-white: #fffdf8;
        --radius-game: 34px;
        --radius-panel: 26px;
        --radius-element: 18px;
        --shadow-clay:
          8px 8px 0 var(--clay-shadow), -4px -4px 8px rgba(255, 255, 255, 0.7);
        --shadow-clay-sm:
          5px 5px 0 var(--clay-shadow), -3px -3px 6px rgba(255, 255, 255, 0.7);
        --shadow-inset:
          inset 5px 5px 8px rgba(190, 145, 105, 0.25),
          inset -4px -4px 8px rgba(255, 250, 240, 0.9);
        --shadow-inset-dark:
          inset 5px 5px 10px rgba(190, 145, 105, 0.3),
          inset -3px -3px 6px rgba(255, 250, 240, 0.6);
        --border-clay: 3px solid var(--clay-dark);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        touch-action: manipulation;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        max-width: 100vw;
        max-height: 100vh;
        overflow: hidden !important;
        background: linear-gradient(145deg, var(--clay-bg), var(--clay-bg-2));
        color: var(--clay-text);
        display: flex;
        justify-content: center;
        align-items: center;
      }

      @media screen and (orientation: portrait) {
        body::before {
          content: "🔄 Please rotate your device to Landscape Mode!";
          position: fixed;
          inset: 0;
          background: #4a3f35;
          color: #ffffff;
          font-size: 1.8rem;
          font-weight: bold;
          display: flex;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 20px;
          z-index: 99999;
        }
      }

      .game-card {
        width: 98vw;
        height: 96vh;
        background: var(--clay-surface);
        border-radius: var(--radius-game);
        padding: 8px 12px;
        box-shadow: var(--shadow-clay);
        border: 3px solid var(--clay-dark);
        position: relative;
        display: flex;
        flex-direction: column;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 4px;
        height: 6vh;
      }

      h1 {
        font-size: 1.2rem;
        color: var(--clay-text);
        margin: 0;
        text-shadow: 2px 3px 0 rgba(217, 185, 157, 0.7);
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: rgba(250, 240, 230, 0.99);
        border-radius: var(--radius-game);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 10px;
        text-align: center;
        overflow-y: auto;
        box-shadow:
          inset 6px 6px 0 rgba(229, 199, 173, 0.5),
          inset -6px -6px 0 rgba(255, 253, 248, 0.7);
        border: 2px dashed var(--clay-dark);
      }

      .overlay.hidden {
        display: none;
      }

      .modal-title {
        font-size: 1.5rem;
        margin-bottom: 8px;
        text-shadow: 2px 3px 0 rgba(217, 185, 157, 0.7);
        color: var(--clay-text);
      }

      .settings-row {
        display: flex;
        gap: 12px;
        margin: 10px 0;
        justify-content: center;
        flex-wrap: wrap;
      }

      .setting-group {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: var(--clay-surface-soft);
        padding: 10px;
        border-radius: var(--radius-element);
        border: 2px solid var(--clay-dark);
        box-shadow: var(--shadow-inset);
      }

      .setting-group label {
        font-size: 0.85rem;
        font-weight: bold;
        margin-bottom: 4px;
        color: var(--clay-text);
      }

      select,
      .mode-btn {
        padding: 8px;
        border-radius: 12px;
        border: 2px solid var(--clay-dark);
        font-size: 0.9rem;
        font-weight: 600;
        outline: none;
      }

      select {
        background: var(--clay-white);
        color: var(--clay-text);
        box-shadow: var(--shadow-clay-sm);
      }

      .mode-selection {
        display: flex;
        gap: 12px;
        margin: 10px 0;
      }

      .mode-btn {
        background: var(--clay-white);
        color: var(--clay-text);
        cursor: pointer;
        transition: all 0.2s ease;
        min-width: 120px;
        box-shadow: var(--shadow-clay-sm);
      }

      .mode-btn:hover {
        transform: translate(-1px, -1px);
        box-shadow:
          7px 7px 0 var(--clay-shadow),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
      }

      .mode-btn:active {
        transform: translate(3px, 3px);
        box-shadow: 2px 2px 0 var(--clay-shadow);
      }

      .mode-btn.active {
        border-color: var(--clay-primary);
        background: linear-gradient(145deg, #f9b08c, var(--clay-primary));
        color: var(--clay-white);
        box-shadow: var(--shadow-clay-sm);
      }

      .btn-start {
        background: linear-gradient(145deg, #f9a878, var(--clay-primary));
        color: var(--clay-white);
        border: 3px solid var(--clay-dark);
        padding: 10px 28px;
        font-size: 1.1rem;
        font-weight: bold;
        border-radius: 30px;
        cursor: pointer;
        margin-top: 12px;
        box-shadow:
          6px 6px 0 var(--clay-shadow),
          -3px -3px 6px rgba(255, 255, 255, 0.7);
        text-shadow: 1px 2px 0 rgba(0, 0, 0, 0.15);
        transition: all 0.2s ease;
      }

      .btn-start:hover {
        transform: translate(-1px, -1px);
        background: linear-gradient(145deg, #faa880, var(--clay-primary-hover));
      }

      .btn-start:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--clay-shadow);
      }

      .status-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 4px 12px;
        background: var(--clay-surface-soft);
        border-radius: var(--radius-element);
        font-weight: 600;
        font-size: 0.85rem;
        border: 2px solid var(--clay-dark);
        box-shadow: var(--shadow-inset);
        height: 5vh;
        margin-top: 4px;
      }

      .status-pill {
        background: linear-gradient(145deg, #f6efe4, #e9dfd0);
        color: var(--clay-text);
        padding: 2px 10px;
        border-radius: 14px;
        border: 2px solid var(--clay-dark);
        box-shadow: 3px 3px 0 rgba(217, 185, 157, 0.6);
      }

      .game-board {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
      }

      .grid-container {
        display: grid;
        gap: 10px;
        justify-content: center;
        align-content: center;
        width: 100%;
        height: 100%;
      }

      .grid-2 {
        grid-template-columns: repeat(2, 1fr);
        grid-template-rows: repeat(2, 1fr);
      }
      .grid-3 {
        grid-template-columns: repeat(3, 1fr);
        grid-template-rows: repeat(3, 1fr);
      }
      .grid-4 {
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
      }

      .card {
        perspective: 900px;
        cursor: pointer;
        position: relative;
        width: 100%;
        height: 100%;
        min-height: 80px;
      }

      .card-inner {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.4s ease;
        border-radius: var(--radius-element);
      }

      .card.flipped .card-inner {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: 0;
        border-radius: var(--radius-element);
        border: 3px solid var(--clay-dark);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 900;
        box-shadow: var(--shadow-clay-sm);
        user-select: none;
      }

      .card-front {
        background: linear-gradient(145deg, #f9a878, #ee8456);
        color: #fffdf8;
        font-size: 2rem;
        border-color: var(--clay-dark);
        text-shadow: 1px 2px 0 rgba(0, 0, 0, 0.18);
      }

      .card-back {
        background: var(--clay-white);
        font-size: 3rem;
        transform: rotateY(180deg);
        border-color: var(--clay-dark);
        color: var(--clay-text);
      }

      .card.matched-keep .card-back {
        background: linear-gradient(145deg, #c9ead9, #a5d9c2);
        border-color: #7db89a;
        color: #2f6b52;
      }

      .card.matched-remove {
        visibility: hidden;
        opacity: 0;
        transition:
          opacity 0.3s ease,
          visibility 0.3s ease;
      }

      /* Correct Animation Overlay */
      #correct-overlay {
        position: fixed;
        inset: 0;
        background: rgba(250, 240, 230, 0.72);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 1000;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }

      #correct-overlay.show {
        opacity: 1;
      }

      #correct-text {
        font-size: 3rem;
        font-weight: 900;
        color: #3d9c72;
        text-shadow: 3px 4px 0 rgba(217, 185, 157, 0.75);
        margin-bottom: 20px;
        transform: scale(0.5);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }

      #correct-overlay.show #correct-text {
        transform: scale(1);
      }

      #correct-icon {
        font-size: 6rem;
        transform: scale(0.5);
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) 0.1s;
      }

      #correct-overlay.show #correct-icon {
        transform: scale(1);
      }
    </style>
  </head>
  <body>
    <div class="game-card">
      <header>
        <h1>Matching Game 🧩</h1>
      </header>

      <!-- Setup Modal -->
      <div id="setup-modal" class="overlay">
        <h2 class="modal-title">Game Setup 🎮</h2>

        <div class="mode-selection">
          <button
            id="mode-single"
            class="mode-btn active"
            onclick="setMode('single')"
          >
            1-Player 👤
          </button>
          <button id="mode-multi" class="mode-btn" onclick="setMode('multi')">
            2-Player 👥
          </button>
        </div>

        <div class="settings-row">
          <div class="setting-group">
            <label>Content Type 🍎</label>
            <select id="opt-content">
              <option value="animal">Animal 🐶</option>
              <option value="vegetable">Vegetable 🥕</option>
              <option value="fruit">Fruit 🍎</option>
              <option value="mix">Mix 🌪️</option>
            </select>
          </div>
          <div class="setting-group">
            <label>Difficulty 🌟</label>
            <select id="opt-level">
              <option value="4">Level 1 ⭐ (2x2)</option>
              <option value="9">Level 2 ⭐⭐ (3x3)</option>
              <option value="16">Level 3 ⭐⭐⭐ (4x4)</option>
            </select>
          </div>
        </div>

        <p style="font-weight: bold; margin-top: 6px">Supervisor Settings ⚙️</p>
        <div class="settings-row">
          <div class="setting-group">
            <label>Block Behaviour 🧱</label>
            <select id="opt-block-beh">
              <option value="0">0: Keep Face-Up ✅</option>
              <option value="1" selected>1: Remove (Default) ❌</option>
              <option value="3">3: Re-randomize & Peek 🔀</option>
            </select>
          </div>
          <div class="setting-group">
            <label>Correct Behaviour 🎉</label>
            <select id="opt-correct-beh">
              <option value="0" selected>0: Continue ⏩</option>
              <option value="1">1: Zoom & Blur 🔍</option>
            </select>
          </div>
          <div class="setting-group">
            <label>Block Placeholder 🔢</label>
            <select id="opt-placeholder">
              <option value="0">0: Solid Color 🟦</option>
              <option value="1" selected>1: Show Number 🔢</option>
            </select>
          </div>
        </div>

        <button class="btn-start" onclick="startGame()">Start Game ▶️</button>
      </div>

      <!-- Game Over Modal -->
      <div id="gameover-modal" class="overlay hidden">
        <h2 id="winner-title" class="modal-title">Game Over! 🏁</h2>
        <p id="winner-details" style="font-size: 1.2rem; margin: 10px 0"></p>
        <button class="btn-start" onclick="openSetup()">Play Again 🔄</button>
      </div>

      <!-- Active Gameboard Status -->
      <div class="status-bar">
        <span id="turn-indicator">Turn 🔄: Player 1 👤</span>
        <span id="score-p1" class="status-pill">P1 Score 🏅: 0</span>
        <span id="score-p2" class="status-pill hidden">P2 Score 🏅: 0</span>
      </div>

      <!-- Main Game Grid -->
      <div class="game-board">
        <div id="grid-container" class="grid-container"></div>
      </div>
    </div>

    <!-- Correct Animation Overlay -->
    <div id="correct-overlay">
      <div id="correct-text">Yeay you correct ✅</div>
      <div id="correct-icon"></div>
    </div>

    <script>
      const CONTENT_DATA = {
        animal: ["🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🐻", "🐼"],
        vegetable: ["🥕", "🥔", "🍅", "🍆", "🥦", "🥬", "🥒", "🌽"],
        fruit: ["🍎", "🍌", "🍇", "🍉", "🍓", "🍒", "🍍", "🥝"],
      };

      let state = {
        mode: "single",
        content: "animal",
        blocks: 4,
        cards: [],
        flippedCards: [],
        matchedPairs: 0,
        totalPairs: 0,
        currentPlayer: 1,
        scores: { 1: 0, 2: 0 },
        isProcessing: false,
        settings: {
          blockBeh: 1,
          correctBeh: 0,
          placeholder: 1,
        },
      };

      function openSetup() {
        document.getElementById("gameover-modal").classList.add("hidden");
        document.getElementById("setup-modal").classList.remove("hidden");
      }

      function setMode(mode) {
        state.mode = mode;
        document
          .getElementById("mode-single")
          .classList.toggle("active", mode === "single");
        document
          .getElementById("mode-multi")
          .classList.toggle("active", mode === "multi");
      }

      function startGame() {
        // Apply supervisor settings before any mode/content/difficulty changes
        state.settings.blockBeh = parseInt(
          document.getElementById("opt-block-beh").value,
        );
        state.settings.correctBeh = parseInt(
          document.getElementById("opt-correct-beh").value,
        );
        state.settings.placeholder = parseInt(
          document.getElementById("opt-placeholder").value,
        );

        state.content = document.getElementById("opt-content").value;
        state.blocks = parseInt(document.getElementById("opt-level").value);
        state.cards = [];
        state.flippedCards = [];
        state.matchedPairs = 0;
        state.currentPlayer = 1;
        state.scores = { 1: 0, 2: 0 };
        state.isProcessing = false;

        state.totalPairs = Math.floor(state.blocks / 2);

        document.getElementById("score-p1").textContent = `P1 Score 🏅: 0`;
        const p2El = document.getElementById("score-p2");
        if (state.mode === "multi") {
          p2El.classList.remove("hidden");
          p2El.textContent = `P2 Score 🏅: 0`;
        } else {
          p2El.classList.add("hidden");
        }

        updateTurnUI();
        generateGrid();
        document.getElementById("setup-modal").classList.add("hidden");
      }

      function updateTurnUI() {
        document.getElementById("turn-indicator").textContent =
          `Turn 🔄: Player ${state.currentPlayer} ${state.currentPlayer === 1 ? "👤" : "👥"}`;
        document.getElementById(`score-p${state.currentPlayer}`).textContent =
          `P${state.currentPlayer} Score 🏅: ${state.scores[state.currentPlayer]}`;
      }

      function generateGrid() {
        const container = document.getElementById("grid-container");
        container.innerHTML = "";
        container.className = `grid-container grid-${Math.sqrt(state.blocks)}`;

        let pool = [];
        if (state.content === "mix") {
          pool = [
            ...CONTENT_DATA.animal,
            ...CONTENT_DATA.vegetable,
            ...CONTENT_DATA.fruit,
          ];
        } else {
          pool = [...CONTENT_DATA[state.content]];
        }

        pool = pool.sort(() => Math.random() - 0.5);
        let selectedEmoticons = pool.slice(0, state.totalPairs);
        let deck = [...selectedEmoticons, ...selectedEmoticons];

        // Handle odd number of blocks (Level 2 ⭐⭐ has 9 blocks)
        if (state.blocks % 2 !== 0) {
          deck.push("🎁"); // Bonus wildcard
        }

        deck = deck.sort(() => Math.random() - 0.5);
        state.cards = deck.map((emoticon, index) => ({
          id: index,
          emoticon: emoticon,
          isMatched: false,
          isFlipped: false,
        }));

        renderCards();
      }

      function renderCards() {
        const container = document.getElementById("grid-container");
        container.innerHTML = "";

        state.cards.forEach((card, index) => {
          const cardEl = document.createElement("div");
          cardEl.className = "card";
          cardEl.dataset.id = card.id;

          let frontContent = state.settings.placeholder === 1 ? index + 1 : "";

          cardEl.innerHTML = `
            <div class="card-inner">
              <div class="card-face card-front">${frontContent}</div>
              <div class="card-face card-back">${card.emoticon}</div>
            </div>
          `;

          if (card.isFlipped || card.isMatched) {
            cardEl.classList.add("flipped");
          }
          if (card.isMatched) {
            if (state.settings.blockBeh === 0)
              cardEl.classList.add("matched-keep");
            else cardEl.classList.add("matched-remove");
          }

          cardEl.addEventListener("click", () => handleCardClick(card, cardEl));
          container.appendChild(cardEl);
        });
      }

      async function handleCardClick(card, cardEl) {
        if (state.isProcessing || card.isFlipped || card.isMatched) return;

        card.isFlipped = true;
        cardEl.classList.add("flipped");

        if (card.emoticon === "🎁") {
          // Instant bonus match for the odd block
          card.isMatched = true;
          await handleMatchSuccess(card.emoticon, true);
          return;
        }

        state.flippedCards.push({ card, cardEl });

        if (state.flippedCards.length === 2) {
          state.isProcessing = true;
          const [first, second] = state.flippedCards;

          if (first.card.emoticon === second.card.emoticon) {
            first.card.isMatched = true;
            second.card.isMatched = true;
            await handleMatchSuccess(first.card.emoticon, false);
          } else {
            await handleMismatch(first, second);
          }

          state.flippedCards = [];

          if (state.mode === "multi") {
            state.currentPlayer = state.currentPlayer === 1 ? 2 : 1;
            updateTurnUI();
            await triggerMultiplayerSequence();
          }

          checkWin();
          state.isProcessing = false;
        }
      }

      async function handleMatchSuccess(emoticon, isBonus) {
        if (!isBonus) {
          state.matchedPairs++;
          state.scores[state.currentPlayer]++;
          updateTurnUI();
        }

        if (state.settings.correctBeh === 1) {
          await showCorrectOverlay(emoticon);
        } else {
          await delay(500);
        }

        await applyBlockBehaviour();
      }

      async function showCorrectOverlay(emoticon) {
        const overlay = document.getElementById("correct-overlay");
        const icon = document.getElementById("correct-icon");
        icon.textContent = emoticon;

        overlay.classList.add("show");
        await delay(1500);
        overlay.classList.remove("show");
        await delay(300);
      }

      async function applyBlockBehaviour() {
        if (state.settings.blockBeh === 3) {
          // Behavior 3: re-randomize active blocks, briefly peek them, then hide again
          reRandomizeActiveBlocks();
          await peekActiveBlocks();
        }
        renderCards();
      }

      async function handleMismatch(first, second) {
        await delay(1000);
        first.card.isFlipped = false;
        second.card.isFlipped = false;
        first.cardEl.classList.remove("flipped");
        second.cardEl.classList.remove("flipped");
      }

      async function triggerMultiplayerSequence() {
        // Turn transition only; block behavior (re-randomize & peek) handled in applyBlockBehaviour
        await delay(300);
      }

      async function peekActiveBlocks() {
        // Reveal all active (unmatched) cards in state so the peek actually renders
        state.cards.forEach((c) => {
          if (
            !c.isMatched &&
            !state.flippedCards.find((f) => f.card.id === c.id)
          )
            c.isFlipped = true;
        });
        renderCards();
        await delay(800);
        // Hide them again
        state.cards.forEach((c) => {
          if (
            !c.isMatched &&
            !state.flippedCards.find((f) => f.card.id === c.id)
          )
            c.isFlipped = false;
        });
        renderCards();
      }

      function reRandomizeActiveBlocks() {
        const activeCards = state.cards.filter((c) => !c.isMatched);
        const emoticons = activeCards
          .map((c) => c.emoticon)
          .sort(() => Math.random() - 0.5);
        activeCards.forEach((c, i) => (c.emoticon = emoticons[i]));
      }

      function checkWin() {
        if (state.matchedPairs === state.totalPairs) {
          setTimeout(() => {
            const p1 = state.scores[1];
            const p2 = state.scores[2];
            let title = "Game Completed! 🌟";
            let details = `You found all pairs! 🎈`;

            if (state.mode === "multi") {
              if (p1 > p2) {
                title = "Player 1 Wins! 🏆";
                details = `Player 1 scored ${p1} points!`;
              } else if (p2 > p1) {
                title = "Player 2 Wins! 🏆";
                details = `Player 2 scored ${p2} points!`;
              } else {
                title = "It's a Tie! 🤝";
                details = `Both players scored ${p1} points!`;
              }
            }

            document.getElementById("winner-title").textContent = title;
            document.getElementById("winner-details").textContent = details;
            document
              .getElementById("gameover-modal")
              .classList.remove("hidden");
          }, 800);
        }
      }

      function delay(ms) {
        return new Promise((resolve) => setTimeout(resolve, ms));
      }
    </script>
  </body>
</html>
